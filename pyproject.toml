[project]
name = "log-closure-capture-detector"
version = "0.1.1"
description = "Warns when a log message holds a closure or big mutable object repr."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
